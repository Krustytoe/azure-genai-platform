name: release-please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A GitHub App token makes the release PR trigger CI; PRs opened with GITHUB_TOKEN don't, so
      # required checks never report. Falls back to GITHUB_TOKEN until the RELEASE_APP_CLIENT_ID
      # variable and RELEASE_APP_PRIVATE_KEY secret exist.
      - id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Release assets: the API image as a tarball plus its CycloneDX SBOM, each with a signed attestation
  # (SLSA build provenance and SBOM). Verify with: gh attestation verify <file> -R <owner>/<repo>
  release-assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
      id-token: write # Sigstore signing for attestations
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Build and save image
        run: |
          docker build -t "ragapi:${TAG}" app
          docker save "ragapi:${TAG}" | gzip -n > "ragapi-${TAG}.tar.gz"
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ragapi:${{ env.TAG }}
          format: cyclonedx
          output: ragapi-${{ env.TAG }}.cdx.json
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ragapi-${{ env.TAG }}.tar.gz
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ragapi-${{ env.TAG }}.tar.gz
          sbom-path: ragapi-${{ env.TAG }}.cdx.json
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "ragapi-${TAG}.tar.gz" "ragapi-${TAG}.cdx.json" --clobber -R "$GITHUB_REPOSITORY"
