version: 2
updates:
  # Third-party actions and the platform-workflows reusable workflow (SHA pins with version comments).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: "/app"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/app"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
